# Render Blueprint — deploys the DocBrain API (apps/api).
# In the Render dashboard: New → Blueprint → select this repo. Render creates
# the service from this file and prompts for every `sync: false` value — paste
# those from your local .env.
services:
  - type: web
    name: docbrain-api
    runtime: node
    plan: free # free tier sleeps when idle (the web app shows a wake-up notice); upgrade to `starter` to avoid cold starts
    buildCommand: corepack enable && corepack prepare pnpm@10.30.2 --activate && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@repo/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes traffic to the port in its PORT env var (default 10000);
      # the API reads API_PORT, so mirror it here.
      - key: API_PORT
        value: "10000"
      # Allowed browser origin — set to your Vercel domain after the web deploy,
      # e.g. https://docbrain.vercel.app
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_CHAT_BASE_URL
        sync: false
      - key: AI_CHAT_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_BASE_URL
        sync: false
      - key: AI_EMBEDDING_API_KEY
        sync: false
      - key: AI_EMBEDDING_MODEL
        sync: false
      - key: AI_EMBEDDING_DIMENSIONS
        sync: false
      # Optional — only if using the X-API-Key auth path (e.g. from Bubble).
      # Omit both to disable it.
      - key: SERVICE_API_KEY
        sync: false
      - key: SERVICE_API_KEY_USER_ID
        sync: false
